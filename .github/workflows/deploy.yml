# Deploys the site to Railway after every push on main (so after every merged pull request).
# The RAILWAY_API_TOKEN secret is a Railway project token, set in the repository settings by the trainer.
name: Deploy

on:
  push:
    branches: [main]

# One deployment at a time: a new push waits for the previous deployment to finish
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  railway:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
      SERVICE_ID: 6d774766-37c0-41a8-8144-2e59a160b5d3
    steps:
      - uses: actions/checkout@v4
        # Deploy the current head of main, even if this run started after a newer push
        with:
          ref: main
      - run: railway up --service="$SERVICE_ID" --ci
